{% load static %}
<nav class="navbar navbar-expand-lg sticky-top glass">
    <div class="container">
        <a class="navbar-brand me-1" href="{% url 'garbage_admin_dashboard' %}">
            <img src="{% static 'images/logo.png' %}" alt="Garbage Classification Logo" height="30"
                class="d-inline-block align-text-top me-1">
            Garbage Classification
        </a>
        <small class="fw-lighter mb-0 me-3 align-bottom">with Artificial Intelligence</small>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="{% url 'garbage_admin_dashboard' %}">Dashboard</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'garbage_admin_dashboard' %}">
                        Garbage
                    </a>

                </li>
                <li class="nav-item"><a class="nav-link" href="{% url 'garbage_admin_profile' %}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'garbage_admin_logout' %}">Logout</a></li>
            </ul>
            <form class="d-flex" role="search" method="POST" , action="{% url 'garbage_admin_search' %}">
                {% csrf_token %}
                <input class="form-control me-2 glass" type="search" placeholder="City, State" aria-label="Search"
                    name="location" required>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            {% else %}
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="{% url 'garbage_admin_login' %}">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'garbage_admin_register' %}">Register</a></li>
            </ul>
            {% endif %}
        </div>
    </div>
</nav>
